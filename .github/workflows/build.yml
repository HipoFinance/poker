name: Build and push image

# Replaces `make push` from a laptop. GITHUB_TOKEN can write to GHCR on its
# own, so no personal access token is involved.

on:
  push:
    branches: [main]
    # Documentation does not change the image. Without this, editing a README or CLAUDE.md
    # publishes a new sha tag, which then makes every pin in `operation` look outdated and
    # invites a deploy that changes nothing. Use the dispatch trigger below to force a build.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The tests are the only thing standing between a bad read and a service that pokes wrongly, so
  # nothing is published without them. They need no chain access and run in a couple of seconds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hipofinance/poker
          # Only a sha tag, never a dated one. A dated tag is mutable and collides -- it is
          # stamped in Tehran time, so an image pushed after 20:30 UTC lands on the next day's tag
          # and takes that name off an earlier image, which has happened. A sha tag names the
          # commit it was built from and is never reassigned, and operation/bump.sh pins by it.
          tags: |
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
